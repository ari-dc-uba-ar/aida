name: CI

on:
  push:
    branches:
      - 'feature*'
      - 'test*'
      - main
  pull_request:
    branches:
      - 'feature*'
      - 'test*'
      - main

jobs:
  # =======================================================
  # JOB 1 — Build + Test
  # =======================================================
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'

      - name: Install dependencies
        run: npm ci --verbose

      - name: Run build
        run: npm run build --if-present

      - name: Run tests
        run: npm test

  # =======================================================
  # JOB 2 — Deploy manual (MAIN y TEST*)
  # =======================================================
  manual-deploy:
    needs: build-and-test

    # Ejecutar solo si la branch es main O empieza con test
    if: |
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/heads/test')

    runs-on: ubuntu-latest

    environment:
      name: DEPLOYMENT   # sin URL (no acepta secrets)

    steps:
      - name: Aprobar manualmente
        uses: trstringer/manual-approval@v1
        with:
          minimum-approvals: 1
          approvers: "anyone"

      - name: Disparar deploy (GET)
        run: |
          curl "${{ secrets.URL_DEPLOYMENT }}"
